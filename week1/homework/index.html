<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>효비 블로그</title>
    <link rel="stylesheet" href="./style.css/header.css" />
    <link rel="stylesheet" href="./style.css/footer.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__inner">
        <a class="header__profile" href="#" aria-label="홈으로 이동">
          <img
            class="header__avatar"
            src="./images/profile.jpg"
            alt="효비의 프로필"
          />
        </a>

        <h1 class="header__title">효비 블로그</h1>

        <nav class="header__socials" aria-label="소셜 링크">
          <a
            class="header__social-link"
            href="https://github.com/Hyobee02"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub 새 창에서 열기"
          >
            <img
              class="header__social-icon"
              src="./images/github.svg"
              alt=""
            />
          </a>
        </nav>
      </div>
    </header>

    <main class="main-content"></main>

    <footer class="footer">
      <div class="footer__inner">
        <p class="footer__text">© 2026 효비 블로그~~~~~</p>
      </div>
    </footer>
  </body>
</html>
